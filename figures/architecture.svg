<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050">
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
</defs>
<style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
    .heading { font-size: 25px; font-weight: 700; }
    .label { font-size: 19px; font-weight: 700; }
    .text { font-size: 17px; }
    .small { font-size: 15px; }
    .mono { font-family: Consolas, "Liberation Mono", monospace; }
    .box { fill: white; stroke: #111; stroke-width: 2; }
    .light { fill: #f2f2f2; stroke: #111; stroke-width: 2; }
    .line { fill: none; stroke: #111; stroke-width: 2; marker-end: url(#arrow); }
</style>

<rect width="1000" height="1050" fill="white"/>

<text class="heading" x="35" y="38">Write and flush</text>
<line x1="35" y1="55" x2="965" y2="55" stroke="#111" stroke-width="1.5"/>

<rect class="box" x="50" y="105" width="250" height="100"/>
<text class="label" x="175" y="145" text-anchor="middle">DB API</text>
<text class="text mono" x="175" y="176" text-anchor="middle">put / deleteKey</text>

<path class="light" d="M 375 120 C 375 105, 625 105, 625 120 L 625 190 C 625 205, 375 205, 375 190 Z"/>
<ellipse cx="500" cy="120" rx="125" ry="15" fill="#f2f2f2" stroke="#111" stroke-width="2"/>
<path d="M 375 190 C 375 205, 625 205, 625 190" fill="none" stroke="#111" stroke-width="2"/>
<text class="label" x="500" y="159" text-anchor="middle">WAL</text>
<text class="small mono" x="500" y="187" text-anchor="middle">CRC | length | payload</text>

<rect class="box" x="700" y="80" width="250" height="150"/>
<rect class="light" x="700" y="80" width="250" height="40"/>
<text class="label" x="825" y="107" text-anchor="middle">Active MemTable</text>
<line x1="700" y1="157" x2="950" y2="157" stroke="#999"/>
<line x1="700" y1="194" x2="950" y2="194" stroke="#999"/>
<text class="small mono" x="718" y="145">apple@51</text>
<text class="small mono" x="718" y="182">cat@42</text>
<text class="small mono" x="718" y="219">dog@37</text>

<path class="line" d="M 300 155 L 365 155"/>
<text class="small" x="332" y="143" text-anchor="middle">1</text>
<path class="line" d="M 635 155 L 690 155"/>
<text class="small" x="662" y="143" text-anchor="middle">2</text>

<rect class="box" x="50" y="310" width="250" height="150"/>
<rect class="light" x="50" y="310" width="250" height="40"/>
<text class="label" x="175" y="337" text-anchor="middle">Immutable MemTable</text>
<line x1="50" y1="387" x2="300" y2="387" stroke="#999"/>
<line x1="50" y1="424" x2="300" y2="424" stroke="#999"/>
<text class="small mono" x="68" y="375">sorted InternalKeys</text>
<text class="small mono" x="68" y="412">old WAL epoch</text>
<text class="small mono" x="68" y="449">readable while flushing</text>

<rect class="box" x="391" y="331" width="240" height="125"/>
<rect class="box" x="383" y="323" width="240" height="125"/>
<rect class="box" x="375" y="315" width="240" height="125"/>
<text class="label" x="495" y="354" text-anchor="middle">new .sst</text>
<text class="small mono" x="495" y="385" text-anchor="middle">data blocks</text>
<text class="small mono" x="495" y="413" text-anchor="middle">index | Bloom | footer</text>

<path class="box" d="M 700 310 L 900 310 L 950 360 L 950 460 L 700 460 Z"/>
<path d="M 900 310 L 900 360 L 950 360" fill="none" stroke="#111" stroke-width="2"/>
<text class="label" x="825" y="376" text-anchor="middle">MANIFEST</text>
<text class="small mono" x="825" y="407" text-anchor="middle">live files + epochs</text>
<text class="small" x="825" y="435" text-anchor="middle">commit point</text>

<path class="line" d="M 825 230 L 825 270 L 175 270 L 175 300"/>
<text class="small" x="500" y="259" text-anchor="middle">freeze</text>
<path class="line" d="M 300 385 L 365 385"/>
<text class="small" x="332" y="373" text-anchor="middle">flush</text>
<path class="line" d="M 641 385 L 690 385"/>

<text class="text" x="50" y="505">1. append record and apply sync policy</text>
<text class="text" x="50" y="535">2. insert the same operation into the ordered MemTable</text>
<text class="text" x="50" y="565">The old WAL is removed after the new SSTable is published by MANIFEST.</text>

<text class="heading" x="35" y="625">File lifecycle and L0 compaction</text>
<line x1="35" y1="642" x2="965" y2="642" stroke="#111" stroke-width="1.5"/>

<path class="box" d="M 60 690 L 260 690 L 320 750 L 320 810 L 60 810 Z"/>
<path d="M 260 690 L 260 750 L 320 750" fill="none" stroke="#111" stroke-width="2"/>
<text class="label" x="190" y="748" text-anchor="middle">MANIFEST</text>
<text class="small mono" x="190" y="777" text-anchor="middle">live files + epochs</text>
<text class="small" x="190" y="800" text-anchor="middle">commit point</text>

<rect class="box" x="680" y="700" width="250" height="100"/>
<text class="label" x="805" y="741" text-anchor="middle">Level 0</text>
<text class="small" x="805" y="772" text-anchor="middle">overlapping, newest first</text>

<polygon class="light" points="690,845 910,845 950,895 910,945 690,945 650,895"/>
<text class="label" x="800" y="887" text-anchor="middle">k-way merge</text>
<text class="small" x="800" y="918" text-anchor="middle">keep newest + tombstone</text>

<rect class="box" x="60" y="845" width="260" height="100"/>
<text class="label" x="190" y="886" text-anchor="middle">Level 1</text>
<text class="small" x="190" y="917" text-anchor="middle">one output per trigger</text>

<path class="line" d="M 320 750 L 670 750"/>
<text class="small" x="495" y="738" text-anchor="middle">publish</text>
<path class="line" d="M 805 800 L 805 835"/>
<path class="line" d="M 640 895 L 330 895"/>
<path class="line" d="M 190 835 L 190 820"/>
<text class="small" x="210" y="832">commit</text>

<text class="text" x="60" y="985">Remove L0 inputs only after the MANIFEST commit.</text>

<line x1="60" y1="1020" x2="130" y2="1020" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<text class="small" x="150" y="1026">write / file lifecycle</text>
</svg>
