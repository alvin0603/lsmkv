<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1600" viewBox="0 0 1000 1600">
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
</defs>
<style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
    .mono { font-family: Consolas, "Liberation Mono", monospace; }
    .heading { font-size: 25px; font-weight: 700; }
    .label { font-size: 19px; font-weight: 700; }
    .text { font-size: 17px; }
    .small { font-size: 15px; }
    .field { fill: white; stroke: #111; stroke-width: 1.8; }
    .fixed { fill: #e5e5e5; stroke: #111; stroke-width: 1.8; }
    .var { fill: white; stroke: #111; stroke-width: 1.8; stroke-dasharray: 7 4; }
    .line { fill: none; stroke: #111; stroke-width: 1.8; marker-end: url(#arrow); }
</style>

<rect width="1000" height="1600" fill="white"/>

<!-- InternalKey -->
<text class="heading" x="35" y="40">InternalKey</text>
<line x1="35" y1="56" x2="965" y2="56" stroke="#111" stroke-width="1.5"/>

<text class="small mono" x="45" y="91">byte 0</text>
<text class="small mono" x="655" y="91" text-anchor="end">N - 1</text>
<text class="small mono" x="675" y="91">N</text>
<text class="small mono" x="955" y="91" text-anchor="end">N + 7</text>
<rect class="field" x="45" y="105" width="620" height="95"/>
<rect class="fixed" x="665" y="105" width="290" height="95"/>
<text class="label mono" x="355" y="145" text-anchor="middle">user_key</text>
<text class="small" x="355" y="174" text-anchor="middle">N bytes</text>
<text class="label mono" x="810" y="145" text-anchor="middle">trailer</text>
<text class="small" x="810" y="174" text-anchor="middle">Fixed64, little-endian</text>

<text class="text mono" x="45" y="240">trailer = (sequence &lt;&lt; 8) | type</text>
<text class="text mono" x="45" y="272">type: kDelete=0, kPut=1</text>
<text class="text mono" x="45" y="304">sort: user_key ASC, trailer DESC</text>
<text class="text mono" x="45" y="344">"cat", seq=42, kPut: trailer=0x2A01; disk bytes=01 2A 00 00 00 00 00 00</text>

<!-- WAL -->
<text class="heading" x="35" y="405">WAL record</text>
<line x1="35" y1="421" x2="965" y2="421" stroke="#111" stroke-width="1.5"/>

<rect class="fixed" x="45" y="455" width="180" height="90"/>
<rect class="fixed" x="225" y="455" width="220" height="90"/>
<rect class="field" x="445" y="455" width="510" height="90"/>
<text class="label mono" x="135" y="492" text-anchor="middle">crc32</text>
<text class="small" x="135" y="520" text-anchor="middle">Fixed32, 4 bytes</text>
<text class="label mono" x="335" y="492" text-anchor="middle">payload_size</text>
<text class="small" x="335" y="520" text-anchor="middle">Fixed32, 4 bytes</text>
<text class="label mono" x="700" y="492" text-anchor="middle">payload[payload_size]</text>
<text class="small" x="700" y="520" text-anchor="middle">CRC coverage</text>

<text class="text mono" x="45" y="612">payload:</text>
<rect class="fixed" x="145" y="572" width="90" height="85"/>
<rect class="fixed" x="235" y="572" width="145" height="85"/>
<rect class="var" x="380" y="572" width="135" height="85"/>
<rect class="field" x="515" y="572" width="155" height="85"/>
<rect class="var" x="670" y="572" width="135" height="85"/>
<rect class="field" x="805" y="572" width="150" height="85"/>
<text class="label mono" x="190" y="606" text-anchor="middle">type</text>
<text class="small" x="190" y="633" text-anchor="middle">1 byte</text>
<text class="label mono" x="307.5" y="606" text-anchor="middle">sequence</text>
<text class="small" x="307.5" y="633" text-anchor="middle">Fixed64</text>
<text class="label mono" x="447.5" y="606" text-anchor="middle">key_size</text>
<text class="small" x="447.5" y="633" text-anchor="middle">Varint32</text>
<text class="label mono" x="592.5" y="617" text-anchor="middle">user_key</text>
<text class="label mono" x="737.5" y="606" text-anchor="middle">value_size</text>
<text class="small" x="737.5" y="633" text-anchor="middle">Varint32</text>
<text class="label mono" x="880" y="617" text-anchor="middle">value</text>
<text class="text mono" x="45" y="705">invalid or incomplete record: ftruncate(last_valid_offset)</text>

<!-- SSTable -->
<text class="heading" x="35" y="775">SSTable file</text>
<line x1="35" y1="791" x2="965" y2="791" stroke="#111" stroke-width="1.5"/>

<text class="small mono" x="45" y="824">offset 0</text>
<text class="small mono" x="955" y="824" text-anchor="end">reader starts at file_size - 40</text>
<rect class="field" x="45" y="840" width="150" height="90"/>
<rect class="field" x="195" y="840" width="150" height="90"/>
<rect class="field" x="345" y="840" width="70" height="90"/>
<rect class="var" x="415" y="840" width="180" height="90"/>
<rect class="field" x="595" y="840" width="180" height="90"/>
<rect class="fixed" x="775" y="840" width="180" height="90"/>
<text class="label mono" x="120" y="877" text-anchor="middle">data block 0</text>
<text class="small" x="120" y="905" text-anchor="middle">target about 4 KiB</text>
<text class="label mono" x="270" y="877" text-anchor="middle">data block 1</text>
<text class="small" x="270" y="905" text-anchor="middle">sorted entries</text>
<text class="label mono" x="380" y="888" text-anchor="middle">...</text>
<text class="label mono" x="505" y="877" text-anchor="middle">sparse index</text>
<text class="small" x="505" y="905" text-anchor="middle">one entry per data block</text>
<text class="label mono" x="685" y="877" text-anchor="middle">Bloom block</text>
<text class="small" x="685" y="905" text-anchor="middle">all user keys</text>
<text class="label mono" x="865" y="877" text-anchor="middle">footer</text>
<text class="small" x="865" y="905" text-anchor="middle">40 bytes</text>
<path class="line" d="M 930 829 L 930 840"/>

<text class="label" x="45" y="982">data entry</text>
<rect class="var" x="45" y="997" width="130" height="70"/>
<rect class="field" x="175" y="997" width="205" height="70"/>
<rect class="var" x="380" y="997" width="130" height="70"/>
<rect class="field" x="510" y="997" width="180" height="70"/>
<text class="small mono" x="110" y="1038" text-anchor="middle">key_size</text>
<text class="small mono" x="277.5" y="1038" text-anchor="middle">InternalKey</text>
<text class="small mono" x="445" y="1038" text-anchor="middle">value_size</text>
<text class="small mono" x="600" y="1038" text-anchor="middle">value</text>

<text class="label" x="720" y="982">Bloom block</text>
<text class="text mono" x="720" y="1014">num_hashes</text>
<text class="text mono" x="955" y="1014" text-anchor="end">Fixed32</text>
<text class="text mono" x="720" y="1042">num_bits</text>
<text class="text mono" x="955" y="1042" text-anchor="end">Fixed64</text>
<text class="text mono" x="720" y="1070">bit_array</text>
<text class="small mono" x="740" y="1096">ceil(num_bits / 8) bytes</text>

<text class="label" x="45" y="1127">index entry</text>
<rect class="var" x="45" y="1142" width="140" height="70"/>
<rect class="field" x="185" y="1142" width="230" height="70"/>
<rect class="fixed" x="415" y="1142" width="145" height="70"/>
<rect class="fixed" x="560" y="1142" width="145" height="70"/>
<text class="small mono" x="115" y="1183" text-anchor="middle">last_key_size</text>
<text class="small mono" x="300" y="1183" text-anchor="middle">last InternalKey</text>
<text class="small mono" x="487.5" y="1183" text-anchor="middle">block_offset</text>
<text class="small mono" x="632.5" y="1183" text-anchor="middle">block_size</text>

<text class="label" x="720" y="1127">footer</text>
<text class="text mono" x="720" y="1159">index_offset</text>
<text class="text mono" x="955" y="1159" text-anchor="end">index_size</text>
<text class="text mono" x="720" y="1187">bloom_offset</text>
<text class="text mono" x="955" y="1187" text-anchor="end">bloom_size</text>
<text class="text mono" x="720" y="1215">magic</text>
<text class="small" x="720" y="1241">5 Fixed64 fields = 40 bytes</text>

<!-- Manifest -->
<text class="heading" x="35" y="1280">Manifest snapshot</text>
<line x1="35" y1="1296" x2="965" y2="1296" stroke="#111" stroke-width="1.5"/>

<rect class="fixed" x="45" y="1330" width="110" height="75"/>
<rect class="fixed" x="155" y="1330" width="140" height="75"/>
<rect class="fixed" x="295" y="1330" width="145" height="75"/>
<rect class="fixed" x="440" y="1330" width="190" height="75"/>
<rect class="fixed" x="630" y="1330" width="140" height="75"/>
<rect class="field" x="770" y="1330" width="185" height="75"/>
<text class="small mono" x="100" y="1374" text-anchor="middle">magic:8</text>
<text class="small mono" x="225" y="1374" text-anchor="middle">next_file_id:8</text>
<text class="small mono" x="367.5" y="1374" text-anchor="middle">last_sequence:8</text>
<text class="small mono" x="535" y="1374" text-anchor="middle">durable_wal_epoch:8</text>
<text class="small mono" x="700" y="1374" text-anchor="middle">table_count:4</text>
<text class="small mono" x="862.5" y="1374" text-anchor="middle">table entries...</text>

<text class="label" x="45" y="1455">table entry</text>
<rect class="fixed" x="45" y="1470" width="110" height="75"/>
<rect class="fixed" x="155" y="1470" width="100" height="75"/>
<rect class="fixed" x="255" y="1470" width="135" height="75"/>
<rect class="var" x="390" y="1470" width="282.5" height="75"/>
<rect class="var" x="672.5" y="1470" width="282.5" height="75"/>
<text class="small mono" x="100" y="1514" text-anchor="middle">file_id:8</text>
<text class="small mono" x="205" y="1514" text-anchor="middle">level:4</text>
<text class="small mono" x="322.5" y="1514" text-anchor="middle">file_size:8</text>
<text class="small mono" x="531.25" y="1503" text-anchor="middle">smallest InternalKey</text>
<text class="small mono" x="531.25" y="1527" text-anchor="middle">length + bytes</text>
<text class="small mono" x="813.75" y="1503" text-anchor="middle">largest InternalKey</text>
<text class="small mono" x="813.75" y="1527" text-anchor="middle">length + bytes</text>

<rect class="fixed" x="45" y="1570" width="18" height="18"/>
<text class="small" x="73" y="1585">fixed-width field</text>
<rect class="var" x="265" y="1570" width="18" height="18"/>
<text class="small" x="293" y="1585">Varint length or variable-size field</text>
<rect class="field" x="650" y="1570" width="18" height="18"/>
<text class="small" x="678" y="1585">raw bytes or repeated entries</text>
</svg>
